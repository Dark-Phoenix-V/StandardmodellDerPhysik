        ];

        // --- COMPONENTS ---

        // ParticleCard
        const ParticleCard = ({ particle, onClick, compact }) => {
            const getTypeLabel = (type) => {
                switch(type) {
                case 'quark': return 'Quark';
                case 'lepton': return 'Lepton';
                case 'boson': return 'Eichboson';
                case 'higgs': return 'Skalarboson';
                default: return type;
                }
            };

            const getColors = (type) => {
                switch(type) {
                case 'quark': return { border: 'border-purple-300', bg: 'bg-white', circle: 'bg-purple-500', text: 'text-purple-600', shadow: 'shadow-purple-50' };
                case 'lepton': return { border: 'border-green-300', bg: 'bg-white', circle: 'bg-green-500', text: 'text-green-600', shadow: 'shadow-green-50' };
                case 'boson': return { border: 'border-red-300', bg: 'bg-white', circle: 'bg-red-500', text: 'text-red-600', shadow: 'shadow-red-50' };
                case 'higgs': return { border: 'border-amber-200', bg: 'bg-white', circle: 'bg-amber-400', text: 'text-amber-600', shadow: 'shadow-amber-50' };
                default: return { border: 'border-gray-200', bg: 'bg-white', circle: 'bg-gray-500', text: 'text-gray-600', shadow: 'shadow-gray-50' };
                }
            };

            const colors = getColors(particle.type);

            const getCompactMass = (massString) => {
                const trimmed = massString.trim();
                if (trimmed.startsWith('<')) {
                    const parts = trimmed.split(' ');
                    if (parts.length >= 2) return `${parts[0]}${parts[1]}`;
                }
                return trimmed.split(' ')[0];
            };

            const getCompactUnit = (massString) => {
                const parts = massString.trim().split(' ');
                if (massString.includes('<') && parts.length >= 3) return parts[2];
                if (parts.length >= 2) return parts[1];
                return '';
            };

            if (compact) {
                return (
                <button 
                    onClick={() => onClick?.(particle)}
                    className={`relative w-full aspect-square min-w-[90px] max-w-[110px] flex flex-col items-center p-1.5 rounded-xl border-[2px] ${colors.border} ${colors.bg} ${colors.shadow} shadow-sm hover:shadow-md hover:scale-[1.02] transition-all active:scale-95 group overflow-hidden`}
                >
                    <div className="absolute top-1 left-1.5 flex flex-col items-start leading-none z-10 text-left">

                            <span className="font-bold text-gray-500 text-[7px] sm:text-[8px]">{getCompactMass(particle.mass)}</span>
                            <span className="font-normal text-gray-400 text-[6px]">{getCompactUnit(particle.mass)}</span>
                        </div>
                        
                        <div className="flex flex-col text-[7px] sm:text-[8px] font-mono text-gray-400">

                            <span className="flex items-center gap-0.5"><span className="opacity-40">s</span><span className="text-gray-600 font-bold">{particle.spin}</span></span>
                        </div>
                    </div>

                    <div className="flex-grow flex items-center justify-center w-full mt-1">
                    <div className={`w-9 h-9 sm:w-11 sm:h-11 rounded-full flex items-center justify-center ${colors.circle} text-white shadow-sm relative z-0 transform group-hover:scale-105 transition-transform`}>
                        <span className="text-lg sm:text-xl font-black">{particle.symbol}</span>
                    </div>
                    </div>

                    <span className="text-[9px] sm:text-[10px] font-black uppercase tracking-tighter text-gray-700 leading-none pb-0.5">{particle.name}</span>
                </button>
                );
            }

            return (
                <div className={`bg-gray-900 border-4 ${colors.border} p-5 rounded-3xl shadow-2xl flex flex-col relative overflow-hidden text-left h-full`}>
                <div className={`absolute -right-8 -top-8 w-32 h-32 rounded-full opacity-10 blur-3xl ${colors.circle}`}></div>
                
                <div className="flex justify-between items-center mb-4 relative z-10">
                    <div>

                    <span className={`text-[8px] font-black uppercase tracking-[0.2em] ${colors.text.replace('600', '400')}`}>

                    </span>
                    </div>
                    <div className={`text-5xl font-mono font-black ${colors.text.replace('600', '400')}`}>
                    {particle.symbol}
                    </div>
                </div>

                <div className="grid grid-cols-2 gap-2 mb-4 relative z-10 text-[10px]">
                    <div className="bg-white/5 p-2 rounded-xl border border-white/10">
                    <p className="text-gray-500 uppercase font-black tracking-widest mb-0.5">Masse</p>
                    <p className="font-mono text-gray-100 font-bold">{particle.mass}</p>
                    </div>
                    <div className="bg-white/5 p-2 rounded-xl border border-white/10">
                    <p className="text-gray-500 uppercase font-black tracking-widest mb-0.5">Ladung</p>
                    <p className="font-mono text-gray-100 font-bold">{particle.charge}</p>
                    </div>
                </div>

                <div className="space-y-4 flex-grow relative z-10">
                    <div className="p-3 bg-gray-950 rounded-xl border border-white/5">
                    <h4 className="text-[9px] uppercase font-black tracking-widest text-blue-400 mb-1">Physikalischer Hintergrund</h4>
                    <p className="text-gray-400 text-xs leading-relaxed">{particle.description}</p>
                    </div>
                    <div className="px-1">
                    <h4 className="text-[9px] uppercase font-black tracking-widest text-green-400 mb-1">Rolle im Standardmodell</h4>
                    <p className="text-gray-200 text-xs leading-relaxed font-bold italic">"{particle.role}"</p>
                    </div>
                </div>
                </div>
            );
        };

        // Quiz Component
        const Quiz = () => {
            const [questions, setQuestions] = useState(QUIZ_QUESTIONS);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);
            
            const [selectedOption, setSelectedOption] = useState(null);
            const [selectedOptions, setSelectedOptions] = useState([]);
            const [orderedItems, setOrderedItems] = useState([]);

            const [isAnswered, setIsAnswered] = useState(false);
            const [incorrectlyAnsweredIds, setIncorrectlyAnsweredIds] = useState([]);

            const initializeQuestionState = (index, currentQuestions) => {
                const q = currentQuestions[index];
                setSelectedOption(null);
                setSelectedOptions([]);
                setIsAnswered(false);
                if (q?.type === 'order') {
                setOrderedItems([...q.options]);
                } else {
                setOrderedItems([]);
                }
            };

            useEffect(() => {
                initializeQuestionState(0, questions);
            }, []);

            const question = questions[currentQuestion];
            const qType = question?.type || 'single';

            const handleSingleSelect = (index) => {
                if (isAnswered) return;
                setSelectedOption(index);
                checkAnswer(index);
            };

            const handleMultiSelect = (index) => {
                if (isAnswered) return;
                if (selectedOptions.includes(index)) {
                setSelectedOptions(selectedOptions.filter(i => i !== index));
                } else {
                setSelectedOptions([...selectedOptions, index]);
                }
            };

            const handleMoveItem = (index, direction) => {
                if (isAnswered) return;
                const newOrder = [...orderedItems];
                const targetIndex = index + direction;
                if (targetIndex >= 0 && targetIndex < newOrder.length) {
                [newOrder[index], newOrder[targetIndex]] = [newOrder[targetIndex], newOrder[index]];
                setOrderedItems(newOrder);
                }
            };

            const checkAnswer = (manualSelection) => {
                let isCorrect = false;
                
                if (qType === 'single') {
                const selection = manualSelection !== undefined ? manualSelection : selectedOption;
                isCorrect = selection === question.correctAnswer;
                } else if (qType === 'multi') {
                const correctSet = new Set(question.correctAnswers || []);
                const selectedSet = new Set(selectedOptions);
                isCorrect = correctSet.size === selectedSet.size && 
                            [...correctSet].every(value => selectedSet.has(value));
                } else if (qType === 'order') {
                isCorrect = JSON.stringify(orderedItems) === JSON.stringify(question.correctOrder);
                }

                setIsAnswered(true);
                if (isCorrect) {
                    setScore(s => s + 1);
                } else {
                    setIncorrectlyAnsweredIds(prev => {
                        if (!prev.includes(question.id)) {
                            return [...prev, question.id];
                        }
                        return prev;
                    });
                }
            };

            const handleNext = () => {
                const nextQuestion = currentQuestion + 1;
                if (nextQuestion < questions.length) {
                initializeQuestionState(nextQuestion, questions);
                setCurrentQuestion(nextQuestion);
                } else {
                setShowResult(true);
                }
            };

            const restartQuiz = () => {
                setQuestions(QUIZ_QUESTIONS);
                setIncorrectlyAnsweredIds([]);
                setCurrentQuestion(0);
                setScore(0);
                setShowResult(false);
                initializeQuestionState(0, QUIZ_QUESTIONS);
            };

            const retryWrongQuestions = () => {
                const wrongQuestions = QUIZ_QUESTIONS.filter(q => incorrectlyAnsweredIds.includes(q.id));
                setQuestions(wrongQuestions);
                setIncorrectlyAnsweredIds([]);
                setCurrentQuestion(0);
                setScore(0);
                setShowResult(false);
                initializeQuestionState(0, wrongQuestions);
            };

            if (showResult) {
                const percentage = Math.round((score / questions.length) * 100);
                const hasWrongAnswers = incorrectlyAnsweredIds.length > 0;

                return (
                <div className="max-w-xl mx-auto text-center py-12 animate-in fade-in duration-500">
                    <h2 className="text-4xl font-bold mb-4">Quiz beendet!</h2>
                    <p className="text-xl text-gray-400 mb-8">
                        Du hast {score} von {questions.length} Fragen richtig beantwortet ({percentage}%).
                    </p>
                    
                    <div className="mb-10 p-4 bg-gray-900 rounded-2xl border border-gray-800">
                        <div className="h-2 bg-gray-800 rounded-full overflow-hidden">
                            <div className={`h-full ${percentage === 100 ? 'bg-green-500' : 'bg-blue-500'}`} style={{width: `${percentage}%`}}></div>
                        </div>
                    </div>

                    <div className="flex flex-col gap-4 justify-center items-center">
                        {hasWrongAnswers && (
                            <button 
                                onClick={retryWrongQuestions} 
                                className="w-full sm:w-auto bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 px-12 rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                Falsche Fragen wiederholen ({incorrectlyAnsweredIds.length})
                            </button>
                        )}
                        
                        <button 
                            onClick={restartQuiz} 
                            className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-xl shadow-lg transition-all active:scale-95"
                        >
                            Quiz komplett neu starten
                        </button>
                    </div>
                </div>
                );
            }

            if (!question) return null;

            return (
                <div className="max-w-2xl mx-auto py-8">
                <div className="flex justify-between items-center mb-8 text-gray-500 uppercase text-[10px] font-black tracking-[0.2em]">
                    <span>Frage {currentQuestion + 1} von {questions.length}</span>
                    <div className="flex gap-1">
                        {questions.map((_, i) => (
                            <div key={i} className={`w-2 h-2 rounded-full ${i === currentQuestion ? 'bg-blue-500' : i < currentQuestion ? 'bg-gray-700' : 'bg-gray-800'}`}></div>
                        ))}
                    </div>
                </div>

                <div className="mb-10">
                    <span className="inline-block px-2 py-1 bg-blue-900/30 text-blue-400 text-[10px] font-bold rounded mb-3 uppercase tracking-widest">
                        {qType === 'multi' ? 'Mehrfachauswahl' : qType === 'order' ? 'Reihenfolge' : 'Einzelauswahl'}
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-bold leading-tight">{question.question}</h2>
                </div>

                <div className="grid gap-3 mb-8">
                    {question.options.map((option, index) => {
                    const isSelected = qType === 'multi' ? selectedOptions.includes(index) : selectedOption === index;
                    const isCorrect = qType === 'single' ? index === question.correctAnswer : question.correctAnswers?.includes(index);
                    
                    let stateClass = "border-gray-700 bg-gray-900 hover:border-gray-600";
                    let statusLabel = null;

                    if (isAnswered) {
                        if (isCorrect) {
                        if (isSelected) {
                            stateClass = "border-green-500 bg-green-500/10 text-green-400";
                            statusLabel = <span className="text-[10px] uppercase font-black bg-green-500/20 px-2 py-0.5 rounded ml-auto">Korrekt</span>;
                        } else {
                            stateClass = "border-yellow-500 bg-yellow-500/5 text-yellow-400 border-dashed";
                            statusLabel = <span className="text-[10px] uppercase font-black bg-yellow-500/20 px-2 py-0.5 rounded ml-auto">Fehlt</span>;
                        }
                        } else if (isSelected) {
                        stateClass = "border-red-500 bg-red-500/10 text-red-400";
                        statusLabel = <span className="text-[10px] uppercase font-black bg-red-500/20 px-2 py-0.5 rounded ml-auto">Falsch</span>;
                        } else {
                        stateClass = "opacity-30 border-gray-800";
                        }
                    } else if (isSelected) {
                        stateClass = "border-blue-500 bg-blue-500/10 ring-1 ring-blue-500";
                    }

                    return (
                        <button
                        key={index}
                        disabled={isAnswered}
                        onClick={() => qType === 'multi' ? handleMultiSelect(index) : handleSingleSelect(index)}
                        className={`p-4 text-left border rounded-xl flex items-center gap-4 transition-all ${stateClass}`}
                        >
                        <div className={`w-5 h-5 rounded flex items-center justify-center border transition-colors ${isSelected ? 'bg-blue-600 border-blue-600' : 'border-gray-600'}`}>
                            {isSelected && (
                                <svg className="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="4" d="M5 13l4 4L19 7"></path></svg>
                            )}
                        </div>
                        <span className="flex-grow font-medium">{option}</span>
                        {statusLabel}
                        </button>
                    );
                    })}
                </div>

                {qType === 'order' && !isAnswered && (
                    <div className="mb-8 flex gap-2 justify-center">
                        {orderedItems.map((item, index) => (
                            <div key={index} className="flex flex-col items-center gap-2">
                                <div className="p-3 bg-gray-800 rounded-lg border border-gray-700 min-w-[100px] text-center text-sm font-bold">
                                    {item}
                                </div>
                                <div className="flex gap-1">
                                    <button 
                                        disabled={index === 0}
                                        onClick={() => handleMoveItem(index, -1)}
                                        className="p-1 rounded bg-gray-700 hover:bg-gray-600 disabled:opacity-30"
                                    >
                                        ←
                                    </button>
                                    <button 
                                        disabled={index === orderedItems.length - 1}
                                        onClick={() => handleMoveItem(index, 1)}
                                        className="p-1 rounded bg-gray-700 hover:bg-gray-600 disabled:opacity-30"
                                    >
                                        →
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                )}

                {qType === 'order' && !isAnswered && (
                    <button 
                        onClick={() => checkAnswer()} 
                        className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98]"
                    >
                        Reihenfolge prüfen
                    </button>
                )}

                {!isAnswered && qType === 'multi' && (
                    <button 
                        onClick={() => checkAnswer()} 
                        disabled={selectedOptions.length === 0}
                        className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98]"
                    >
                        Antworten prüfen
                    </button>
                )}

                {isAnswered && (
                    <div className="p-6 bg-gray-900 border border-gray-800 rounded-2xl animate-in fade-in slide-in-from-bottom-2">
                    <div className="mb-6">
                        <h4 className="text-blue-400 font-black uppercase text-xs tracking-widest mb-2">Erklärung</h4>
                        <p className="text-sm text-gray-300 leading-relaxed italic">"{question.explanation}"</p>
                    </div>
                    <button 
                        onClick={handleNext} 
                        className="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-gray-200 transition-all shadow-lg active:scale-[0.98]"
                    >
                        {currentQuestion + 1 === questions.length ? "Ergebnis anzeigen" : "Nächste Frage"}
                    </button>
                    </div>
                )}
                </div>
            );
        };

        // ModelGrid Component
        const ModelGrid = () => {

            return (

                    <div className="w-full overflow-x-auto pb-4 custom-scrollbar flex justify-center">

                        <div className="grid grid-cols-[30px_repeat(3,minmax(100px,1fr))_minmax(100px,1fr)_minmax(100px,1fr)] gap-1 mb-1">

                        </div>

                        </div>
                        
                        <div className="col-start-1"></div>
                        <div className="text-center text-gray-400 font-serif italic text-sm">I</div>
                        <div className="text-center text-gray-400 font-serif italic text-sm">II</div>
                        <div className="text-center text-gray-400 font-serif italic text-sm">III</div>
                        <div className="col-span-2"></div>
                        </div>

                        <div className="grid grid-cols-[30px_repeat(3,minmax(100px,1fr))_minmax(100px,1fr)_minmax(100px,1fr)] gap-1.5">
                        
                        <div className="row-start-1 row-span-2 flex items-center justify-center">

                            Quarks
                            </div>

                        <div className="row-start-1 col-start-2"><ParticleCard particle={getP('up')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-1 col-start-3"><ParticleCard particle={getP('charm')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-1 col-start-4"><ParticleCard particle={getP('top')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-1 col-start-5"><ParticleCard particle={getP('gluon')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-1 col-start-6"><ParticleCard particle={getP('higgs')} compact onClick={setSelectedParticle} /></div>

                        <div className="row-start-2 col-start-2"><ParticleCard particle={getP('down')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-2 col-start-3"><ParticleCard particle={getP('strange')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-2 col-start-4"><ParticleCard particle={getP('bottom')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-2 col-start-5"><ParticleCard particle={getP('photon')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-2 col-start-6 bg-gray-50/50 rounded-xl border border-dashed border-gray-200 flex items-center justify-center">
                            <span className="text-[8px] text-gray-300 font-bold uppercase rotate-45">Skalar</span>
                        </div>

                        <div className="row-start-3 row-span-2 flex items-center justify-center">
                            <div className="-rotate-90 whitespace-nowrap uppercase tracking-widest text-green-600 font-black text-[10px] w-full text-center">
                            Leptonen
                            </div>
                        </div>

                        <div className="row-start-3 col-start-2"><ParticleCard particle={getP('electron')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-3 col-start-3"><ParticleCard particle={getP('muon')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-3 col-start-4"><ParticleCard particle={getP('tau')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-3 col-start-5"><ParticleCard particle={getP('z-boson')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-3 col-start-6 bg-gray-50/50 rounded-xl border border-dashed border-gray-200 flex items-center justify-center">
                            <span className="text-[8px] text-gray-300 font-bold uppercase rotate-45">Vektor</span>
                        </div>

                        <div className="row-start-4 col-start-2"><ParticleCard particle={getP('electron-neutrino')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-4 col-start-3"><ParticleCard particle={getP('muon-neutrino')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-4 col-start-4"><ParticleCard particle={getP('tau-neutrino')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-4 col-start-5"><ParticleCard particle={getP('w-boson')} compact onClick={setSelectedParticle} /></div>
                        <div className="row-start-4 col-start-6 bg-gray-50/50 rounded-xl border border-dashed border-gray-200 flex items-center justify-center">
                            <span className="text-[8px] text-gray-300 font-bold uppercase rotate-45">Eich</span>
                        </div>

                        </div>

                        <div className="mt-4 pt-3 border-t border-gray-100 flex flex-wrap gap-x-6 gap-y-2 justify-center">
                            <div className="flex items-center gap-1.5"><div className="w-1.5 h-1.5 rounded-full bg-gray-300"></div><span className="text-[8px] font-bold text-gray-400 uppercase tracking-tighter">Oben links: Masse</span></div>
                            <div className="flex items-center gap-1.5"><div className="w-1.5 h-1.5 rounded-full bg-gray-300"></div><span className="text-[8px] font-bold text-gray-400 uppercase tracking-tighter">q: Ladung</span></div>
                            <div className="flex items-center gap-1.5"><div className="w-1.5 h-1.5 rounded-full bg-gray-300"></div><span className="text-[8px] font-bold text-gray-400 uppercase tracking-tighter">s: Spin</span></div>
                            <div className="flex items-center gap-1.5"><div className="w-1.5 h-1.5 rounded-full bg-blue-400"></div><span className="text-[8px] font-bold text-blue-500 uppercase tracking-tighter">Unten rechts: Einheit</span></div>

                    </div>
                    </div>

                    <div className="w-full lg:w-[320px] shrink-0">
                    {selectedParticle ? (

                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>

                    </div>

                    <div className="py-12 space-y-16">

                            <p className="text-gray-400 italic max-w-3xl mx-auto">
                            Alle fundamentalen Teilchen und ihre Wechselwirkungen in einer einzigen, interaktiven Ansicht. Klicke auf ein Teilchen, um seine Details zu enthüllen.
                            </p>
                        </div>
                        <ModelGrid />
                        </section>
                        
                        <section>
                        <div className="text-center mb-8">
                            <h2 className="text-3xl font-bold mb-2">Die Teilchen-Familien & Kräfte</h2>
                            <p className="text-gray-400 max-w-2xl mx-auto">Jedes Teilchen gehört zu einer Gruppe mit spezifischen Eigenschaften. Eichbosonen sind dabei die Boten der Naturkräfte.</p>
                        </div>
                        <div className="grid md:grid-cols-2 gap-6 max-w-4xl mx-auto">
                            <ExplanationCard title="Quarks: Gebundene Bausteine" color="border-purple-500/20">
                            <p>Quarks sind die fundamentalen Bausteine der Materie, aus der Atomkerne bestehen. Ihre einzigartige Eigenschaft ist, dass sie die <strong>starke Kernkraft</strong> spüren. Diese Kraft ist so immens, dass Quarks niemals isoliert, sondern immer in Gruppen gebunden vorkommen – ein Phänomen namens <strong>Confinement</strong>.</p>
                            <p>Sie kombinieren sich zu Teilchen, die man <strong>Hadronen</strong> nennt. Die bekanntesten sind <strong>Baryonen</strong> (aus 3 Quarks), wie das Proton (Up, Up, Down) und das Neutron (Up, Down, Down), sowie <strong>Mesonen</strong> (aus 1 Quark und 1 Antiquark).</p>
                            </ExplanationCard>
                            <ExplanationCard title="Leptonen: Freie Einzelgänger" color="border-green-500/20">
                            <p>Leptonen sind die zweite Klasse von Materieteilchen. Im Gegensatz zu Quarks spüren sie die starke Kernkraft nicht und können daher als freie, einzelne Teilchen existieren. Das bekannteste Lepton ist das <strong>Elektron</strong>, das die Hülle von Atomen bildet und für Elektrizität verantwortlich ist.</p>
                            <p>Es gibt drei Generationen von Leptonen, wobei jede ein schwereres, instabiles, geladenes Teilchen (Myon, Tauon) und ein fast masseloses, elektrisch neutrales <strong>Neutrino</strong> enthält. Neutrinos interagieren extrem schwach und durchdringen Materie fast ungehindert.</p>

                            <p>Diese Teilchen sind keine Materie, sondern die Vermittler der Naturkräfte (außer Gravitation). Man nennt sie "Botenteilchen".</p>
                            <ul className="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Starke Kernkraft (Gluonen):</strong> Die stärkste Kraft im Universum. Sie "klebt" Quarks zusammen, um Protonen und Neutronen zu bilden. Ihre Reichweite ist winzig (nur im Atomkern).</li>
                                <li><strong>Elektromagnetismus (Photonen):</strong> Verantwortlich für Licht, Elektrizität und den Zusammenhalt von Atomen (Elektronenhülle am Kern). Hat unendliche Reichweite.</li>
                                <li><strong>Schwache Kernkraft (W- & Z-Bosonen):</strong> Verantwortlich für den radioaktiven Zerfall und Kernfusion in der Sonne. Sie kann als einzige Kraft die Teilchenart (den "Flavor") ändern.</li>
                            </ul>
                            </ExplanationCard>
                            <div className="flex flex-col gap-6">
                                <ExplanationCard title="Skalarboson: Der Massen-Geber" color="border-amber-500/20">
                                <p>Diese Familie hat derzeit nur ein einziges bestätigtes Mitglied: das <strong>Higgs-Boson</strong>. Es ist einzigartig, weil es einen Spin von 0 hat. Es ist kein klassisches Kraftteilchen, sondern die sichtbare Anregung des unsichtbaren, allgegenwärtigen <strong>Higgs-Feldes</strong>.</p>
                                <p>Der Mechanismus ist elegant: Elementarteilchen erhalten ihre Masse nicht von sich aus, sondern durch ihre Interaktion mit diesem Feld.</p>
                                </ExplanationCard>
                                <div className="bg-gray-900/30 p-4 rounded-xl border border-gray-800 border-dashed">
                                    <h4 className="text-gray-500 text-xs font-black uppercase tracking-widest mb-1">Hinweis zur Gravitation</h4>
                                    <p className="text-gray-400 text-xs">Die Schwerkraft ist <strong>nicht</strong> Teil des Standardmodells. Ein hypothetisches Boson, das "Graviton", wurde bisher nicht gefunden.</p>
                                </div>
                            </div>
                            <div className="md:col-span-2">
                            <ExplanationCard title="Antimaterie: Das Spiegelbild" color="border-pink-500/20">
                                <p>Für jedes Teilchen im Standardmodell gibt es ein entsprechendes <strong>Antiteilchen</strong>. Diese besitzen exakt dieselbe Masse wie ihre Gegenstücke, tragen aber die entgegengesetzte elektrische Ladung (und andere Quantenzahlen).</p>
                                <p>Das Antiteilchen des Elektrons ist beispielsweise das <strong>Positron</strong> (positive Ladung), und Quarks haben Antiquarks. Wenn Materie und Antimaterie aufeinandertreffen, löschen sie sich gegenseitig vollständig aus (Annihilation) und wandeln ihre Masse gemäß Einsteins Formel E=mc² in reine Energie um.</p>
                            </ExplanationCard>
                            </div>
                        </div>
                        </section>
                    </div>
                    </div>

                    <div className={currentView === 'quiz' ? '' : 'hidden'}>
                    <Quiz />
                    </div>
                </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
